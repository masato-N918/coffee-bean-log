[project]
name = "coffee-bean-log-backend"
version = "0.1.0"
description = "coffee-bean-log のバックエンド API（FastAPI）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
    "pymysql>=1.2.4",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import の並び順, UP: 新しい書き方への置き換え, B: バグになりやすい書き方
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 自動生成したマイグレーションは、CHECK 制約の SQL などで1行が長くなるため行の長さを見ない
"migrations/versions/*.py" = ["E501"]
